<div class="cadastro-container">
  <div class="jarvis-panel cadastro-box jarvis-scroll">
    <div class="jarvis-panel__header">
      <span>Registro de Novo Administrador</span>
      <div
        class="jarvis-status"
        [class.jarvis-status--alert]="errorMessage"
        [style.color]="successMessage ? 'var(--jarvis-primary)' : ''"
      >
        {{ errorMessage ? 'FALHA' : successMessage ? 'SUCESSO' : 'AGUARDANDO DADOS' }}
      </div>
    </div>

    <form [formGroup]="cadastroForm" (ngSubmit)="onSubmit()">
      <!-- SESSÃO 1: DADOS PESSOAIS -->
      <h3 class="section-title">Parâmetros Base</h3>

      <div class="form-group">
        <input
          type="text"
          formControlName="name"
          class="jarvis-input"
          placeholder="Nome Completo"
          required
        />
      </div>

      <div class="form-group">
        <input
          type="email"
          formControlName="email"
          class="jarvis-input"
          placeholder="E-mail de acesso"
          required
        />
      </div>

      <div class="form-group">
        <input
          type="password"
          formControlName="password"
          class="jarvis-input"
          placeholder="Senha (Mín. 8 caracteres)"
          required
        />
      </div>

      <!-- SESSÃO 2: CONTEXTO DA IA -->
      <h3 class="section-title mt-4">Configuração do Cérebro (Contexto IA)</h3>

      <div formGroupName="ai_context">
        <div class="form-group">
          <input
            type="text"
            formControlName="profession"
            class="jarvis-input"
            placeholder="Sua profissão ou cargo"
          />
        </div>

        <div class="form-group">
          <input
            type="text"
            formControlName="tech_stack"
            class="jarvis-input"
            placeholder="Tecnologias (Separe por vírgula. Ex: Python, React)"
          />
        </div>

        <div class="form-group">
          <input
            type="text"
            formControlName="hobbies"
            class="jarvis-input"
            placeholder="Hobbies (Separe por vírgula. Ex: RPG, Games)"
          />
        </div>

        <div class="form-group">
          <input
            type="text"
            formControlName="current_projects"
            class="jarvis-input"
            placeholder="Projetos Atuais (Separe por vírgula)"
          />
        </div>

        <div class="form-group">
          <textarea
            formControlName="custom_instructions"
            class="jarvis-input"
            rows="3"
            placeholder="Instruções personalizadas de como o sistema deve agir com você..."
          ></textarea>
        </div>
      </div>

      <!-- MENSAGENS DO SISTEMA -->
      <div class="messages" *ngIf="errorMessage || successMessage">
        <span *ngIf="errorMessage" class="jarvis-status jarvis-status--alert">{{
          errorMessage
        }}</span>
        <span *ngIf="successMessage" class="jarvis-status">{{ successMessage }}</span>
      </div>

      <div class="form-actions">
        <button type="submit" class="jarvis-btn" [disabled]="cadastroForm.invalid || isLoading">
          {{ isLoading ? 'PROCESSANDO...' : 'CRIAR REGISTRO' }}
        </button>
      </div>
    </form>

    <div class="login-link">
      <span>Já tem acesso?</span>
      <a routerLink="/login">Voltar ao Login</a>
    </div>
  </div>
</div>
