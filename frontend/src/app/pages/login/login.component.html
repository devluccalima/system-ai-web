<div class="login-container">
  <!-- O Painel Sci-Fi -->
  <div class="jarvis-panel login-box">
    <!-- Cabeçalho do HUD -->
    <div class="jarvis-panel__header">
      <span>Autenticação de Usuário</span>
      <div class="jarvis-status" [class.jarvis-status--alert]="errorMessage">
        {{ errorMessage ? 'FALHA' : 'SISTEMA ONLINE' }}
      </div>
    </div>

    <!-- Formulário -->
    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <input
          type="email"
          formControlName="email"
          class="jarvis-input"
          placeholder="E-mail de acesso"
          required
        />
      </div>

      <div class="form-group">
        <input
          type="password"
          formControlName="password"
          class="jarvis-input"
          placeholder="Senha"
          required
        />
      </div>

      <!-- Erro visual do Jarvis -->
      <div class="error-message" *ngIf="errorMessage">
        <span class="jarvis-status jarvis-status--alert">{{ errorMessage }}</span>
      </div>

      <div class="form-actions">
        <button type="submit" class="jarvis-btn" [disabled]="loginForm.invalid || isLoading">
          {{ isLoading ? 'AUTENTICANDO...' : 'INICIAR SESSÃO' }}
        </button>
      </div>
    </form>

    <!-- Link para Cadastro -->
    <div class="register-link">
      <span>Não possui registro?</span>
      <a routerLink="/cadastro">Solicitar Acesso</a>
    </div>
  </div>
</div>
